[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-engineerer"
version = "0.1.0"
description = "Transforme uma demanda em Markdown em um prompt revisado."
requires-python = ">=3.11"
dependencies = ["openai>=2,<3", "pydantic>=2.10,<3", "rich>=13.9,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
prompt-engineerer = "prompt_engineerer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
prompt_engineerer = ["resources/*.md", "resources/*.json", "resources/templates/*"]

[tool.pytest.ini_options]
testpaths = ["src/prompt_engineerer/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
